name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reelnest_test
          POSTGRES_USER: reelnest
          POSTGRES_PASSWORD: reelnest
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U reelnest -d reelnest_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://reelnest:reelnest@localhost:5433/reelnest_test
      SECRET_KEY: ci-test-secret-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_test_ci
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.4.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run tests with coverage
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-fail-under=60
