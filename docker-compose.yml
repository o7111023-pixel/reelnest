services:
  postgres:
    image: postgres:16-alpine
    container_name: reelnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelnest
      POSTGRES_USER: reelnest
      POSTGRES_PASSWORD: reelnest
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reelnest-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reelnest:reelnest@postgres:5432/reelnest
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
