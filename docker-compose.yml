services:
  postgres:
    image: postgres:16-alpine
    container_name: reelnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelnest
      POSTGRES_USER: reelnest
      POSTGRES_PASSWORD: reelnest
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
